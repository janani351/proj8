<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><link rel="stylesheet" href="style.css"></head><body><main class="calculator"><div class="top"><span>CALCULATOR</span><button id="theme" aria-label="Toggle theme">◐</button></div><div class="display"><div id="expression"></div><output id="result">0</output></div><div class="keys"><button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">⌫</button><button class="utility" data-value="%">%</button><button class="operator" data-value="/">÷</button><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button><button data-action="sign">±</button><button data-value="0">0</button><button data-value=".">.</button><button class="equal" data-action="equals">=</button></div><p>Use your keyboard, too.</p></main><script src="script.js"></script></body></html>
