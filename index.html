<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Focus Timer</title><link rel="stylesheet" href="style.css"></head><body><main class="panel"><span class="tag">FOCUS • RESET • REPEAT</span><h1>Pomodoro Timer</h1><div class="tabs"><button class="tab active" data-mode="focus">Focus</button><button class="tab" data-mode="short">Short break</button><button class="tab" data-mode="long">Long break</button></div><div class="clock" id="clock">25:00</div><div class="progress"><div id="progress"></div></div><div class="controls"><button id="start">Start</button><button id="reset" class="secondary">Reset</button></div><p id="state">Ready when you are.</p><div class="sessions">Completed focus sessions <strong id="count">0</strong></div><p class="tip">Tip: Choose one task and give it your full attention.</p></main><script src="script.js"></script></body></html>
